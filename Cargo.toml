[workspace]
resolver = "2"
members = [
    "contracts/access-control",
    "contracts/aid-contract",
    "contracts/treasury-contract",
    "contracts/referral-contract",
    "contracts/governance-contract",
    "contracts/oracle-contract",
    "contracts/payments-contract",
    "contracts/registry-contract",
    "contracts/upgradeability",
    "shared",
    "testing",
    "contracts/rebalancer-contract",
    "contracts/nft-marketplace",
]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", default-features = true }
shared = { path = "shared" }

ed25519-dalek = "=2.1.1"
rand_core = "=0.6.4"
curve25519-dalek = "=4.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
panic = "abort"
strip = "symbols"
debug = false
